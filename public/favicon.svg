<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Círculo de fondo -->
  <circle cx="16" cy="16" r="16" fill="#1976d2"/>
  <!-- Tijeras: basadas en el ícono de scissors de Material Design, escaladas y centradas -->
  <!-- Mango superior -->
  <path d="M10 7 C10 7, 14 10, 16 16" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Mango inferior -->
  <path d="M10 25 C10 25, 14 22, 16 16" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Hoja superior -->
  <path d="M16 16 L26 10" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Hoja inferior -->
  <path d="M16 16 L26 22" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Anillo superior -->
  <circle cx="9" cy="6.5" r="2.5" stroke="white" stroke-width="1.8" fill="none"/>
  <!-- Anillo inferior -->
  <circle cx="9" cy="25.5" r="2.5" stroke="white" stroke-width="1.8" fill="none"/>
  <!-- Punto central (tornillo) -->
  <circle cx="16" cy="16" r="1.3" fill="white"/>
</svg>
