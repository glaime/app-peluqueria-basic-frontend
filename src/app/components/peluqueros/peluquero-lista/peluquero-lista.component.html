<div class="page-header">
  <h2 class="page-titulo">Peluqueros</h2>
  <button mat-raised-button color="primary" (click)="navegarNuevo()">
    <mat-icon>add</mat-icon>
    Nuevo peluquero
  </button>
</div>

@if (loading()) {
  <div class="spinner-container">
    <mat-progress-spinner mode="indeterminate" diameter="48" />
  </div>
}

@if (error()) {
  <p class="mensaje-error">{{ error() }}</p>
}

@if (sinResultados()) {
  <div class="estado-vacio">
    <mat-icon class="icono-vacio">person_off</mat-icon>
    <p>No hay peluqueros registrados.</p>
    <button mat-stroked-button color="primary" (click)="navegarNuevo()">
      Agregar el primero
    </button>
  </div>
}

@if (!loading() && peluqueros().length > 0) {
  <mat-card>
    <table mat-table [dataSource]="peluqueros()" class="tabla-completa">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let p">{{ p.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let p">{{ p.name }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let p">
          <button
            mat-icon-button
            color="primary"
            (click)="navegarEditar(p.id)"
            [attr.aria-label]="'Editar ' + p.name"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="warn"
            (click)="eliminar(p.id)"
            [attr.aria-label]="'Eliminar ' + p.name"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    </table>
  </mat-card>
}
